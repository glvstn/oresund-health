# Hämtar från SMHI och laddar upp data/current.json till Vercel Blob.
# Startas en gång i timmen (minut 17) av cron-job.org via workflow_dispatch, inte av GitHubs schema,
# som aldrig startade. Ha inte båda igång, då kan SMHI få två anrop samma timme. Se docs/beslut.md.
# Arkivet (normalspann) hämtas bara en gång per dygn och cachas mellan körningarna.
# Klorofyll från Copernicus Marine hämtas också en gång per dygn (data/klorofyll.json, cachas).
# Strömprognos från DMI hämtas en gång per modellkörning (fyra per dygn, klar cirka 3 h 20 min efter start).
# Hemligheter som krävs: BLOB_READ_WRITE_TOKEN (från Vercel-projektets Blob-store),
# COPERNICUSMARINE_SERVICE_USERNAME och COPERNICUSMARINE_SERVICE_PASSWORD.
name: Hämta från SMHI

on:
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache@v6
        with:
          path: data/base.json
          key: base-${{ steps.day.outputs.date }}-${{ hashFiles('scripts/fetch_smhi.py') }}

      - name: Arkiv och normalspann (en gång per dygn)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_smhi.py base

      - name: Senaste dygnet
        run: python3 scripts/fetch_smhi.py current

      - id: chl
        uses: actions/cache@v6
        with:
          path: data/klorofyll.json
          key: chl-${{ steps.day.outputs.date }}-${{ hashFiles('scripts/fetch_copernicus.py') }}

      - name: Klorofyll från Copernicus (en gång per dygn)
        if: steps.chl.outputs.cache-hit != 'true'
        # Ett fel här ska inte stoppa SMHI-datat, sidan visar då klorofyll från förra lyckade körningen.
        continue-on-error: true
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          pip install --quiet copernicusmarine==2.3.0
          python3 scripts/fetch_copernicus.py

      # Senaste modellkörning som bör vara klar: 00, 06, 12 eller 18 UTC, minst 3 h 20 min sedan.
      - id: run
        run: |
          t=$(date -u -d '-200 minutes' +'%F %H')
          echo "id=${t% *}-$(( 10#${t#* } / 6 ))" >> "$GITHUB_OUTPUT"

      - id: fc
        uses: actions/cache@v6
        with:
          path: data/prognos.json
          key: prognos-${{ steps.run.outputs.id }}-${{ hashFiles('scripts/fetch_dmi.py') }}

      - name: Strömprognos från DMI (en gång per modellkörning)
        if: steps.fc.outputs.cache-hit != 'true'
        # Ett fel här ska inte stoppa SMHI-datat. Sidan döljer prognosen när den är äldre än ett dygn.
        continue-on-error: true
        run: python3 scripts/fetch_dmi.py

      - name: Ladda upp till Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm install --no-save --no-package-lock --silent @vercel/blob@2.9.0
          node scripts/upload_blob.mjs
